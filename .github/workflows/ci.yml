name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Run OpenAI skill validator
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/openai/skills/49f948faa9258a0c61caceaf225e179651397431/skills/.system/skill-creator/scripts/quick_validate.py \
            --output /tmp/openai-quick-validate.py
          python /tmp/openai-quick-validate.py skills/ai-prompting
      - name: Run OpenAI plugin validator
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/openai/codex/2b7c279735d0d096cf7b34fe98938f46792f4d4f/codex-rs/skills/src/assets/samples/plugin-creator/scripts/validate_plugin.py \
            --output /tmp/validate_plugin.py
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/openai/codex/2b7c279735d0d096cf7b34fe98938f46792f4d4f/codex-rs/skills/src/assets/samples/plugin-creator/scripts/identifier_validation.py \
            --output /tmp/identifier_validation.py
          python /tmp/validate_plugin.py .
      - name: Run package tests
        run: python -m unittest discover -s tests -v
      - name: Build and verify all install packages
        run: python3 packaging/build_packages.py "$RUNNER_TEMP/packages" --status "CI check, not published"
